name: Build and Deploy web_server to Azure Container Apps

on:
  push:
    branches: [ master ]   # must match your OIDC subject

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Get ACR name
      run: |
        ACR_NAME=$(az acr list --query "[0].name" -o tsv)
        echo "ACR_NAME=$ACR_NAME" >> $GITHUB_ENV

    - name: Build and Push Docker image
      run: |
        az acr login --name $ACR_NAME
        docker build -t $ACR_NAME.azurecr.io/gs1-web:${{ github.sha }} ./web_server
        docker push $ACR_NAME.azurecr.io/gs1-web:${{ github.sha }}

    - name: Deploy to Container App
      run: |
        az containerapp update \
          --name gs1-app \
          --resource-group gs1-rg \
          --image $ACR_NAME.azurecr.io/gs1-web:${{ github.sha }}
